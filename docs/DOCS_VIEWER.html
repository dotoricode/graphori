<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphori 문서 뷰어</title>
<style>
  /*
    이 페이지는 항상 밝은 테마로 고정한다.
    file:// 로 Markdown을 직접 열면 브라우저/뷰어가 어두운 테마를
    강제로 씌워서 흰 배경에 흰 글씨(또는 그 반대)가 되는 문제가
    있었기 때문에, 색을 전부 명시적으로 지정하고 color-scheme도
    light로 고정한다.
  */
  :root { color-scheme: light; }
  html, body { background: #ffffff; color: #172033; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    line-height: 1.7;
    background: #ffffff;
    color: #172033;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 24px 96px;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .topbar {
    background: #f4f6fa;
    border-bottom: 1px solid #c3cddc;
    padding: 10px 24px;
    font-size: 13px;
    color: #3b4a63;
  }
  .topbar a { color: #0645ad; }
  h1, h2, h3, h4, h5, h6 {
    color: #172033;
    line-height: 1.35;
    margin: 1.6em 0 .6em;
  }
  h1 { margin-top: 0; border-bottom: 2px solid #172033; padding-bottom: .35em; font-size: 1.7em; }
  h2 { font-size: 1.35em; border-bottom: 1px solid #b8c3d1; padding-bottom: .25em; }
  h3 { font-size: 1.15em; }
  p { margin: .8em 0; color: #172033; }
  a { color: #0645ad; text-decoration: underline; }
  a:visited { color: #4b2e83; }
  strong { color: #172033; }
  code {
    color: #172033;
    background: #eef2f7;
    border: 1px solid #b8c3d1;
    border-radius: 3px;
    padding: .1em .35em;
    font-size: .92em;
    overflow-wrap: anywhere;
  }
  pre {
    color: #172033;
    background: #eef2f7;
    border: 1px solid #8795a8;
    border-radius: 6px;
    padding: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  pre code { background: none; border: none; padding: 0; }
  .table-wrap { overflow-x: auto; margin: 1em 0 1.5em; }
  table { width: 100%; border-collapse: collapse; background: #ffffff; }
  th, td {
    color: #172033;
    border: 1px solid #66758a;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  th { background: #e6ebf2; font-weight: 700; }
  ul, ol { padding-left: 1.6em; color: #172033; }
  li { margin: .3em 0; }
  blockquote {
    border-left: 4px solid #0645ad;
    margin: 1em 0;
    padding: .2em 16px;
    color: #172033;
    background: #f4f6fa;
  }
  hr { border: none; border-top: 1px solid #b8c3d1; margin: 2em 0; }
  .status { color: #172033; background: #fff8d6; border: 1px solid #806b00; padding: 10px 14px; border-radius: 4px; }
  .error {
    color: #7a1f1f;
    background: #fff0f0;
    border: 1px solid #a33;
    padding: 14px 16px;
    border-radius: 4px;
    line-height: 1.7;
  }
  .error code { background: #ffe3e3; border-color: #cf8f8f; }
</style>
</head>
<body>
<div class="topbar">Graphori 문서 뷰어 &mdash; <code>docs/</code> 폴더 안의 <code>.md</code> 파일만 볼 수 있습니다.</div>
<main id="content"><p class="status">문서를 불러오는 중...</p></main>
<script>
(function () {
  "use strict";

  /*
   * 허용 규칙(반드시 전부 통과해야 안전한 경로로 취급한다):
   *  - 문자열이고 길이가 1~260자
   *  - NUL 문자를 포함하지 않는다
   *  - ".." 를 포함하지 않는다 (상위 폴더 이동 차단)
   *  - "\\" 역슬래시를 포함하지 않는다 (Windows 경로 차단)
   *  - ":" 콜론을 포함하지 않는다 (드라이브 문자, file:, http: 같은 URL 스킴 차단)
   *  - "/" 로 시작하지 않는다 (절대 경로 차단)
   *  - 허용 문자([A-Za-z0-9._/-])만 사용하고 ".md" 로 끝난다
   *  - "//" 연속 슬래시를 포함하지 않는다 (프로토콜 상대 URL, 빈 경로 조각 차단)
   */
  var MD_PATH_ALLOWLIST_RE = /^[A-Za-z0-9][A-Za-z0-9._/-]*\.md$/;

  function isSafeDocPath(raw) {
    if (typeof raw !== "string") return false;
    if (raw.length === 0 || raw.length > 260) return false;
    if (raw.indexOf(" ") !== -1) return false;
    if (raw.indexOf("..") !== -1) return false;
    if (raw.indexOf("\\") !== -1) return false;
    if (raw.indexOf(":") !== -1) return false;
    if (raw.charAt(0) === "/") return false;
    if (raw.indexOf("//") !== -1) return false;
    if (!MD_PATH_ALLOWLIST_RE.test(raw)) return false;
    return true;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function isSafeHref(href) {
    var m = href.match(/^([a-zA-Z][a-zA-Z0-9+.\-]*):/);
    if (!m) return true; // 상대 링크, 앵커(#) 등은 허용
    var scheme = m[1].toLowerCase();
    return scheme === "http" || scheme === "https" || scheme === "mailto";
  }

  function inline(raw) {
    var s = escapeHtml(raw);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (full, text, href) {
      if (!isSafeHref(href)) return text;
      return '<a href="' + href + '" rel="noopener noreferrer">' + text + "</a>";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    return s;
  }

  function render(md) {
    var lines = md.replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var i = 0;
    var listStack = []; // {type: 'ul'|'ol'}

    function closeLists() {
      while (listStack.length) {
        out.push("</" + listStack.pop().type + ">");
      }
    }

    while (i < lines.length) {
      var line = lines[i];

      if (/^\s*```/.test(line)) {
        closeLists();
        var buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + escapeHtml(buf.join("\n")) + "</code></pre>");
        continue;
      }

      if (/^\|.*\|?\s*$/.test(line) && i + 1 < lines.length && /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i + 1])) {
        closeLists();
        var headerRow = line;
        i += 2;
        var bodyRows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { bodyRows.push(lines[i]); i++; }
        var cells = function (r) {
          return r.replace(/^\|/, "").replace(/\|\s*$/, "").split("|").map(function (x) { return x.trim(); });
        };
        var thead = "<tr>" + cells(headerRow).map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr>";
        var tbody = bodyRows.map(function (r) {
          return "<tr>" + cells(r).map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
        }).join("");
        out.push('<div class="table-wrap"><table><thead>' + thead + "</thead><tbody>" + tbody + "</tbody></table></div>");
        continue;
      }

      var h = line.match(/^(#{1,6})\s+(.+)/);
      if (h) {
        closeLists();
        var level = h[1].length;
        out.push("<h" + level + ">" + inline(h[2]) + "</h" + level + ">");
        i++;
        continue;
      }

      if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
        closeLists();
        out.push("<hr>");
        i++;
        continue;
      }

      var bq = line.match(/^>\s?(.*)/);
      if (bq) {
        closeLists();
        var qbuf = [inline(bq[1])];
        i++;
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          qbuf.push(inline(lines[i].replace(/^>\s?/, "")));
          i++;
        }
        out.push("<blockquote><p>" + qbuf.join("<br>") + "</p></blockquote>");
        continue;
      }

      var ol = line.match(/^(\s*)\d+\.\s+(.+)/);
      var ul = line.match(/^(\s*)[-*]\s+(.+)/);
      if (ol || ul) {
        var type = ol ? "ol" : "ul";
        var text = ol ? ol[2] : ul[2];
        if (!listStack.length || listStack[listStack.length - 1].type !== type) {
          closeLists();
          out.push("<" + type + ">");
          listStack.push({ type: type });
        }
        out.push("<li>" + inline(text) + "</li>");
        i++;
        continue;
      }

      if (!line.trim()) {
        closeLists();
        i++;
        continue;
      }

      closeLists();
      out.push("<p>" + inline(line) + "</p>");
      i++;
    }
    closeLists();
    return out.join("\n");
  }

  function showError(message) {
    document.getElementById("content").innerHTML =
      '<div class="error"><p><strong>이 문서를 열 수 없습니다.</strong></p><p>' + escapeHtml(message) + "</p>" +
      "<p>사용법: <code>DOCS_VIEWER.html?file=상대경로.md</code></p>" +
      "<p>예시: <a href=\"DOCS_VIEWER.html?file=PROCESS.md\">DOCS_VIEWER.html?file=PROCESS.md</a></p>" +
      "<p>규칙: <code>docs/</code> 폴더 아래의 상대 경로만 허용합니다. " +
      "<code>..</code>, 절대 경로(<code>/</code>로 시작), 드라이브 문자, " +
      "<code>http://</code> 같은 외부 URL은 거부합니다.</p></div>";
  }

  function loadDoc(path) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", path, true);
    xhr.onload = function () {
      if (xhr.status === 0 || (xhr.status >= 200 && xhr.status < 300)) {
        document.title = path + " — Graphori 문서 뷰어";
        document.getElementById("content").innerHTML = render(xhr.responseText);
      } else {
        showError("파일을 불러오는 중 오류가 발생했습니다 (HTTP " + xhr.status + "). 경로: " + path);
      }
    };
    xhr.onerror = function () {
      showError("파일을 읽지 못했습니다. docs 폴더 안에 그 파일이 실제로 있는지 확인하세요. 경로: " + path);
    };
    xhr.send();
  }

  var params = new URLSearchParams(window.location.search);
  var file = params.get("file");

  if (!file) {
    showError("file 값이 없습니다. 볼 문서의 상대 경로를 file= 뒤에 적어주세요.");
  } else if (!isSafeDocPath(file)) {
    showError("허용되지 않는 경로입니다: " + file);
  } else {
    loadDoc(file);
  }
})();
</script>
</body>
</html>
