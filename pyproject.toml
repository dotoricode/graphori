[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphori-core"
version = "0.9.0b1"
description = "Graph-based orchestration that runs only needed coding agents and verifies every result"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Dotoricode"}]
keywords = ["ai-agents", "audit", "coding-agents", "journal", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Documentation = "https://github.com/dotoricode/graphori"
Source = "https://github.com/dotoricode/graphori"
Changelog = "https://github.com/dotoricode/graphori/blob/main/CHANGELOG.md"
Issues = "https://github.com/dotoricode/graphori/issues"

[project.scripts]
graphori = "graphori_core.product_cli:main"
graphori-cli = "graphori_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphori_core = ["model_data/*.json"]
